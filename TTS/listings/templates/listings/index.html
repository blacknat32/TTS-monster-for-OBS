{% load static %}
<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Brain-Rot Simulator</title>
    <link rel="stylesheet" href="{% static 'listings/style.css' %}">
  </head>
  <body>
    <main>
      <h1>Brain-Rot Simulator</h1>
      <form action="{% url 'listings' %}" method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Get Ear-Rape</button>
      </form>

      {% if error %}
        <p role="alert">{{ error }}</p>
      {% endif %}

      {% if audio_url %}
        <section aria-label="Audio généré">
          <h2>Votre audio</h2>
          <audio controls src="{{ audio_url }}">
            Votre navigateur ne prend pas en charge la lecture audio.
          </audio>
          <p><a href="{{ audio_url }}">Télécharger l’audio</a></p>
        </section>
      {% endif %}
    </main>
  </body>
</html>
