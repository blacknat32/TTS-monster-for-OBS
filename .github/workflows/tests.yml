name: Tests

# Lance les tests à chaque push, sur n'importe quelle branche, et sur chaque
# pull request. Le résultat sert de condition de merge (voir README).
on:
  push:
  pull_request:

permissions:
  contents: read

# Si on pousse de nouveau sur la même branche, on annule l'exécution précédente.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows : la plateforme réelle du streamer. Ubuntu : rapide et portable.
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      # unittest-xml-reporting ne sert qu'à la CI : il produit le rapport JUnit.
      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt unittest-xml-reporting==4.0.0

      - name: Vérifier la configuration Django
        run: python TTS/manage.py check

      - name: Lancer les tests
        run: python TTS/manage.py test listings --testrunner xmlrunner.extra.djangotestrunner.XMLTestRunner

      # Les deux étapes suivantes tournent aussi quand des tests échouent.
      - name: Rapport des tests
        if: always()
        run: python .github/scripts/test_report.py test-reports/junit.xml "Tests (${{ matrix.os }})"

      - name: Joindre le rapport JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.os }}
          path: test-reports/
          if-no-files-found: warn
